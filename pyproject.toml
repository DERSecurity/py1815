[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py1815"
version = "0.1.0"
description = "A DNP3 (IEEE 1815) outstation in pure Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["dnp3", "ieee-1815", "scada", "outstation", "der"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# No runtime dependencies, and that is a design decision rather than an
# accident: the library runs where no compiler does. See docs/DESIGN.md, D1.
dependencies = []

[project.scripts]
# The IEEE 1815.2 DER outstation: fetch the profile's point tables, serve a
# simulated DER, poll a running outstation. See `py1815.profile.cli`.
py1815-der = "py1815.profile.cli:main"

[project.optional-dependencies]
# Building the documentation site. mkdocstrings reads the package's own
# docstrings, so the docs build also proves the public API imports.
docs = [
    # Capped below 2.0 deliberately. MkDocs 2.0 removes the plugin system and
    # the theming system with no migration path, which would take mkdocstrings
    # and Material with it. Revisit once that ecosystem has settled.
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26",
    # mkdocstrings formats rendered signatures with Black or Ruff if one is
    # present and leaves them on one line if neither is. Most of this API is
    # keyword-only, so the wrapped form is the readable one.
    "ruff>=0.6",
]
dev = ["py1815[docs]", "pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/py1815"]

[tool.hatch.build.targets.sdist]
# Hatchling fills an sdist from the whole tree by default, not from the package,
# so without this a source distribution carries the repository.
#
# This is an allow-list rather than a list of things to keep out. A path added
# to the repository tomorrow is absent from the sdist until someone names it
# here, which is the safe direction to fail: the cost of forgetting is a source
# distribution missing a file, not one carrying something nobody meant to ship.
#
# Written when the repository was private, where the asymmetry was sharper. It
# is public now and the argument is weaker but not gone: an sdist is what a
# downstream packager builds from, and it should be the library and the means
# to verify it rather than a copy of the repository.
include = [
    "src/py1815",
    # Anchored to the root: hatchling reads these as gitignore patterns, and a
    # bare "tests" also matches tools/tests, which would sweep the release
    # tooling's own tests into the sdist without the tool they test.
    "/tests",
    "docs",
    # The tables `tests/test_conformance.py` checks the implementation against.
    # Without them that test cannot run, and the shipped suite is what a
    # downstream packager uses to decide whether the build is sound.
    "conformance",
    # Only a README: what the Device Profile schema is and where to get it. The
    # schema itself is ignored, so this is the whole of what the directory
    # holds in a checkout and in the sdist.
    "schema",
    # Pending changelog fragments and the README that explains them. Hatchling
    # would force-include that README whatever this list said, so naming the
    # directory is what keeps the release check honest about it.
    "changelog.d",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "NOTICE",
]
# `docs` is named above and the planning documents live inside it. They are
# written for the people building the library rather than the people using it,
# which is the same line `mkdocs.yml` draws when it keeps them off the site and
# publishes `DESIGN.md` on purpose.
#
# `interop` is not in the allow-list at all, and is named here because hatchling
# force-includes README files wherever they sit -- an allow-list it honors for
# most things but not for all of them. That is why the release workflow asserts
# the contents rather than trusting this list: the list is the intent, the check
# is the guarantee.
exclude = [
    "docs/planning",
    "interop",
    # Tests the interoperability fixture, which is not in the allow-list and so
    # is not here to be tested. What ships is the library and the tests of the
    # library; a test whose subject was left out is one that cannot pass, and a
    # downstream packager running the shipped suite would report it as a bug.
    "tests/test_interop_fixture.py",
    # The same, for the changelog assembler under `scripts/`, which is release
    # tooling and is not shipped either.
    "tests/test_changelog_fragments.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
# tools/tests holds the release tooling's own tests. They live beside the
# tool rather than in tests/ because the sdist ships tests/ and not tools/,
# and the release workflow runs the shipped suite from an extracted sdist.
testpaths = ["tests", "tools/tests"]
pythonpath = ["src"]
# Strict rather than auto: an async test without the marker is a test that never
# ran, and silence is how that goes unnoticed.
asyncio_mode = "strict"
