[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py1815"
version = "0.1.0.dev0"
description = "A DNP3 (IEEE 1815) outstation in pure Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["dnp3", "ieee-1815", "scada", "outstation", "der"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# No runtime dependencies, and that is a design decision rather than an
# accident: the library runs where no compiler does. See docs/DESIGN.md, D1.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/py1815"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Strict rather than auto: an async test without the marker is a test that never
# ran, and silence is how that goes unnoticed.
asyncio_mode = "strict"
