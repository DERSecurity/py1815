name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about two minutes. A hang must fail the job well before
    # GitHub's six-hour default. pytest-timeout (see pyproject.toml) fails the
    # hanging test by name first; this is the backstop.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests interop scripts
      - run: ruff format --check src tests interop scripts
      - run: mypy src
      # Validates changelog.d/, so a malformed entry fails here rather
      # than at release, when whoever is cutting it has the least context.
      - run: python scripts/build_changelog.py --check
      # The master's API document is built from a description of its
      # operations. This fails when the one committed is not the one built.
      - run: python -m py1815.master.openapi --check
      - run: pytest -q
        env:
          # The console is tested in a browser, and a machine without one skips
          # those tests. This runner has one, so on one version of Python a
          # skip is a failure: a test that silently never ran is the outcome
          # the skip would otherwise allow.
          PY1815_REQUIRE_BROWSER: ${{ matrix.python-version == '3.12' && '1' || '' }}

  image:
    # The Dockerfile is what the README tells people to build, so it is built
    # here rather than discovered broken by the first person to follow it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t py1815-der .
      - name: The command runs
        run: docker run --rm py1815-der --help
      - name: Without the tables it says how to get them
        # Not fetched here: CI has no business downloading IEEE's workbook on
        # every push, and the refusal is the behavior a new user meets first.
        run: |
          if docker run --rm py1815-der run 2> message; then
            echo "the outstation started with no tables to serve"; exit 1
          fi
          grep -q "py1815-der tables fetch" message
      - name: The image carries no point tables
        # They may not be redistributed, and an image is a thing people push.
        # `.dockerignore` is what keeps a copy in a checkout out of the build;
        # this is the check that it did.
        #
        # `find` exits non-zero over the directories an unprivileged user may
        # not read, which says nothing about what it found. So its status is
        # not the test; what it printed is.
        run: |
          found=$(docker run --rm --entrypoint sh py1815-der -c \
            'find / -xdev \( -name "*.xlsx" -o -name "ieee-1815-2-*.json" \) 2>/dev/null || true')
          test -z "$found" || { echo "the image carries: $found"; exit 1; }
      # The same file makes a second image: the master, with its API and its
      # console. It is built and run here for the reason the first is.
      - run: docker build --target master -t py1815-master .
      - name: The master's command runs
        run: docker run --rm py1815-master --help
      - name: The master's image serves its console and guards its API
        # A container listens on every interface, which the console will not
        # do without a token. Its own page needs none; the service does.
        run: |
          docker run -d --name master -p 127.0.0.1:8815:8815 \
            -e PY1815_MASTER_TOKEN=ci py1815-master
          for attempt in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:8815/ && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8815/ | grep -q "Satori DNP3 Master"
          curl -fs http://127.0.0.1:8815/openapi.json | grep -q '"openapi"'
          refused=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8815/api/status)
          test "$refused" = 401 || { echo "with no token the API answered $refused"; exit 1; }
          curl -fs -H 'Content-Type: application/json' -H 'Authorization: Bearer ci' \
            -d '{}' http://127.0.0.1:8815/api/status | grep -q '"ok":true'
          docker logs master 2>&1 | grep -q 'token=ci'
          docker rm -f master
      - name: Told nothing, the master makes a token and prints where to go
        run: |
          docker run -d --name master py1815-master
          for attempt in $(seq 1 30); do
            docker logs master 2>&1 | grep -q 'console at' && break
            sleep 1
          done
          docker logs master 2>&1 | grep -Eq 'http://localhost:8815/\?token=.{16,}'
          docker rm -f master
      - name: The master's image carries no point tables either
        run: |
          found=$(docker run --rm --entrypoint sh py1815-master -c \
            'find / -xdev \( -name "*.xlsx" -o -name "ieee-1815-2-*.json" \) 2>/dev/null || true')
          test -z "$found" || { echo "the image carries: $found"; exit 1; }
      - name: The compose file is one Docker accepts
        # Not brought up: its first step downloads IEEE's workbook, which CI
        # does not do. That it parses, and names targets the file has, is what
        # can be checked here.
        run: |
          docker compose config --quiet
          docker compose build

  test-arm32:
    # The library is meant to run on small ARM controllers, and some of those
    # are 32-bit. Every other job here runs where a native integer and a
    # pointer are 64 bits, so a width assumption in a `struct` format, an
    # integer, or a timestamp would pass all of them. This one runs the unit
    # suite where they are 32.
    #
    # What runs: the whole suite, `pytest -q -x`, on Python 3.12 for
    # `linux/arm/v7` under QEMU user-mode emulation, then the event buffer
    # memory measurement so the log carries the 32-bit figure.
    #
    # What does not: ruff, mypy and the changelog check, which read the source
    # and answer the same on any machine. So the job installs the package,
    # `pytest` and `pytest-asyncio`, and not the dev extra, whose tools may
    # have no wheel for this platform. The tests that validate a Device
    # Profile against the Users Group schema skip here as they do in `test`,
    # for want of the schema. One Python version, because emulation is slow
    # and the question is the platform, not the interpreter.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: The unit suite passes where a native integer is 32 bits
        # The first command is the check that this is the platform it claims
        # to be. Without it, an image that resolved to the runner's own
        # architecture would run the suite at 64 bits and pass, and the job
        # would be green for a reason that has nothing to do with its name.
        #
        # Mounted read-only: the suite has no business writing to a checkout,
        # and a container running as root would leave files the runner's user
        # cannot remove.
        run: |
          docker run --rm --platform linux/arm/v7 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD":/src:ro -w /src \
            python:3.12-slim sh -ec '
              python -c "import platform, struct, sys; print(platform.machine(), sys.maxsize); assert struct.calcsize(\"P\") == 4 and sys.maxsize == 2**31 - 1, \"this is not a 32-bit interpreter\""
              pip install --no-cache-dir --root-user-action=ignore -q . pytest pytest-asyncio
              pytest -q -x -p no:cacheprovider
              python scripts/measure_event_memory.py
            '

  image-arm:
    # The image is what runs on the controller, so it is built for the two ARM
    # targets as well as for the runner's own. Emulated, like `test-arm32`.
    # Only that it builds and that the command starts: what the image holds is
    # checked once, in `image`, and does not depend on the architecture.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm
      - run: docker build --platform ${{ matrix.platform }} -t py1815-der .
      - name: The command runs
        run: docker run --rm --platform ${{ matrix.platform }} py1815-der --help
      - run: docker build --platform ${{ matrix.platform }} --target master -t py1815-master .
      - name: The master's command runs
        run: docker run --rm --platform ${{ matrix.platform }} py1815-master --help
