name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests interop scripts
      - run: ruff format --check src tests interop scripts
      - run: mypy src
      # Validates changelog.d/, so a malformed entry fails here rather
      # than at release, when whoever is cutting it has the least context.
      - run: python scripts/build_changelog.py --check
      - run: pytest -q

  image:
    # The Dockerfile is what the README tells people to build, so it is built
    # here rather than discovered broken by the first person to follow it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t py1815-der .
      - name: The command runs
        run: docker run --rm py1815-der --help
      - name: Without the tables it says how to get them
        # Not fetched here: CI has no business downloading IEEE's workbook on
        # every push, and the refusal is the behavior a new user meets first.
        run: |
          if docker run --rm py1815-der run 2> message; then
            echo "the outstation started with no tables to serve"; exit 1
          fi
          grep -q "py1815-der tables fetch" message
      - name: The image carries no point tables
        # They may not be redistributed, and an image is a thing people push.
        # `.dockerignore` is what keeps a copy in a checkout out of the build;
        # this is the check that it did.
        run: |
          found=$(docker run --rm --entrypoint sh py1815-der -c \
            'find / -xdev \( -name "*.xlsx" -o -name "ieee-1815-2-*.json" \) 2>/dev/null')
          test -z "$found" || { echo "the image carries: $found"; exit 1; }
