name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests interop scripts
      - run: ruff format --check src tests interop scripts
      - run: mypy src
      # Validates changelog.d/, so a malformed entry fails here rather
      # than at release, when whoever is cutting it has the least context.
      - run: python scripts/build_changelog.py --check
      - run: pytest -q
