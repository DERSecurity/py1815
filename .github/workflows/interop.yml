name: interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Implementations that are not this one, reading this one.
#
# Everything in the unit suite is this library marking its own homework: a test
# that encodes with this library and decodes with it agrees with itself through
# any mistake both halves share. These jobs are the part that does not.
#
# Four peers, chosen so that no two of them are the same codebase wearing
# different clothes:
#
#   opendnp3-master  a C++ stack, driven through its Python bindings. Reads
#                    points and checks them.
#   rust-master      a Rust stack by different authors. Reads points, checks
#                    the quality octet the C++ one discards, and confirms a
#                    refused control arrives as a refusal.
#   parsers          Wireshark and Suricata, two independent C dissectors,
#                    reading a capture of the whole function code sweep and
#                    verifying every checksum in it.
#
# The masters answer "does it say the right thing". The parsers answer "is what
# it put on the wire really DNP3". Those are different questions and neither
# subsumes the other.

jobs:
  opendnp3-master:
    name: a C++ master reads the points
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The master runs under its own Python 3.10 virtual environment, because
    # dnp3-python ships wheels for cp38 through cp310 only. Two environments in
    # one job rather than a container: fewer moving parts, nothing to cache.
    #
    # Its upstream is end-of-life, which disqualifies it as a dependency and
    # not as a witness: a frame it parses is a frame that was correct when it
    # was maintained, and the wire format has not moved.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for the outstation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: |
          python -m venv .venv-outstation
          .venv-outstation/bin/pip install --quiet -e .

      - name: Set up Python for the master
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the independent master
        run: |
          python3.10 -m venv .venv-master
          .venv-master/bin/pip install --quiet dnp3-python==0.3.0b2

      - name: Start the outstation
        run: |
          # -u because a cancelled job loses whatever sits in Python's block
          # buffer, which is exactly the output needed to explain the cancellation.
          .venv-outstation/bin/python -u interop/outstation.py --port 20000 \
            > outstation.log 2>&1 &
          # Waits for this outstation's own log line rather than for something
          # to be bound to the port. The port test would pass on whatever else
          # happened to be listening, which is nothing in a CI runner and is
          # worth not depending on.
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read it with the independent master
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: .venv-master/bin/python -u interop/probe.py --port 20000

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  rust-master:
    name: a Rust master reads the points and their quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A second implementation in a second language, rather than a second
    # interface onto the first. It also checks what the C++ job structurally
    # cannot: opendnp3's Python bindings store point values as bare scalars and
    # discard the quality octet, so that job verifies values and not flags.
    # This stack hands the flags to its read handler.
    #
    # The crate it uses is source available rather than open source, and is here
    # for continuous integration only. interop/rust-master/Cargo.toml carries
    # the reasoning; deleting that directory and this job removes it entirely.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: pip install --quiet -e .

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the master's dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust-master/target
          key: rust-master-${{ hashFiles('interop/rust-master/Cargo.lock') }}

      - name: Build the independent master
        working-directory: interop/rust-master
        run: cargo build --locked

      - name: Start the outstation
        run: |
          # -u for the same reason the other jobs use it: a cancelled job
          # loses whatever sits in Python's block buffer, which is exactly
          # the output needed to explain the cancellation.
          python -u interop/outstation.py --port 20000 > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read it with the independent master
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: interop/rust-master/target/debug/interop-rust-master 127.0.0.1:20000

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  parsers:
    name: independent dissectors read the whole sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The sweep walks the function code space and writes the exchange to a
    # capture. Two dissectors nobody here wrote then read it back.
    #
    # The capture is written by the sweep rather than by tcpdump. That needs no
    # root and has no race between starting a capture and starting the traffic,
    # whose failure mode is an empty file and a job that passes because there
    # was nothing to disagree with. interop/pcap.py has the trade-off.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: pip install --quiet -e .

      - name: Install the dissectors
        run: |
          # tshark asks at install time whether non-superusers may capture.
          # This job only reads a file, and an unanswered question here would
          # hang the run rather than fail it.
          echo 'wireshark-common wireshark-common/install-setuid boolean false' \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark suricata
          tshark --version | head -1
          suricata -V

      - name: Start the outstation
        run: |
          # -u for the same reason the other jobs use it: a cancelled job
          # loses whatever sits in Python's block buffer, which is exactly
          # the output needed to explain the cancellation.
          python -u interop/outstation.py --port 20000 > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Walk the function codes, recording the exchange
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: |
          python -u interop/sweep.py --port 20000 \
            --pcap sweep.pcap --summary sweep.json

      - name: Read the capture with Wireshark's dissector
        run: python -u interop/validate_pcap.py sweep.pcap --port 20000 --expect sweep.json

      - name: Read the capture with Suricata's parser
        run: |
          mkdir -p suricata-out
          suricata -r sweep.pcap -c interop/suricata.yaml -l suricata-out \
            --set app-layer.protocols.dnp3.detection-ports.dp=20000
          python -u interop/validate_suricata.py suricata-out/eve.json --expect sweep.json

      - name: Logs
        if: always()
        run: |
          cat outstation.log || true
          tail -50 suricata-out/suricata.log || true

      - name: Keep the capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnp3-function-sweep
          path: |
            sweep.pcap
            sweep.json
            suricata-out/eve.json
          if-no-files-found: ignore

  interop:
    name: interop
    runs-on: ubuntu-latest
    needs: [opendnp3-master, rust-master, parsers]
    if: always()
    # One gate the branch protection can name, in front of however many peer
    # jobs there turn out to be.
    #
    # Required status checks are configured by job name, so naming each peer
    # directly means every time a peer is added, removed or renamed the branch
    # protection silently stops matching -- and a required check that no longer
    # runs is not a check that fails, it is a pull request that can never merge.
    # Adding a peer should not require an administrator.
    steps:
      - name: Every peer agreed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "peer jobs: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "a peer job did not succeed"
              exit 1
            fi
          done
          echo "every peer read this outstation without objection"
