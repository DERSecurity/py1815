name: interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Implementations that are not this one, reading this one.
#
# Everything in the unit suite is this library marking its own homework: a test
# that encodes with this library and decodes with it agrees with itself through
# any mistake both halves share. These jobs are the part that does not.
#
# Four implementations across three jobs, chosen so that no two of them are the
# same codebase wearing different clothes:
#
#   opendnp3-master  opendnp3 (https://github.com/dnp3/opendnp3), a C++ stack,
#                    driven through the dnp3-python bindings. Reads points
#                    and checks them.
#   rust-master      the `dnp3` crate by Step Function I/O
#                    (https://github.com/stepfunc/dnp3), a Rust stack by
#                    different authors. Reads points, checks the quality
#                    octet the C++ one discards, and confirms a refused
#                    control arrives as a refusal.
#   parsers          Wireshark and Suricata, two independent C dissectors,
#                    reading a capture of the whole function code sweep, and
#                    a capture of this library's master reading the same
#                    outstation, and verifying every checksum in both.
#
# The masters answer "does it say the right thing". The parsers answer "is what
# it put on the wire really DNP3". Those are different questions and neither
# subsumes the other.
#
# Two more jobs test the other direction: this library's master reading and
# commanding outstations it did not write.
#
#   opendnp3-outstation  an outstation built on opendnp3, the same C++ stack,
#                        through the dnp3-python bindings.
#   rust-outstation      an outstation built on the `dnp3` crate by Step
#                        Function I/O (https://github.com/stepfunc/dnp3).
#
# Both serve the same fixture and log every control and time write they
# receive. interop/master_check.py checks what the master decodes against the
# fixture, and what each outstation logged against what the master sent.

jobs:
  opendnp3-master:
    name: a C++ master reads the points
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The master runs under its own Python 3.10 virtual environment, because
    # dnp3-python ships wheels for cp38 through cp310 only. Two environments in
    # one job rather than a container: fewer moving parts, nothing to cache.
    #
    # Its upstream is end-of-life, which disqualifies it as a dependency and
    # not as a witness: a frame it parses is a frame that was correct when it
    # was maintained, and the wire format has not moved.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for the outstation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: |
          python -m venv .venv-outstation
          .venv-outstation/bin/pip install --quiet -e .

      - name: Set up Python for the master
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the independent master
        run: |
          python3.10 -m venv .venv-master
          .venv-master/bin/pip install --quiet dnp3-python==0.3.0b2

      - name: Start the outstation
        run: |
          # -u because a cancelled job loses whatever sits in Python's block
          # buffer, which is exactly the output needed to explain the cancellation.
          .venv-outstation/bin/python -u interop/outstation.py --port 20000 \
            > outstation.log 2>&1 &
          # Waits for this outstation's own log line rather than for something
          # to be bound to the port. The port test would pass on whatever else
          # happened to be listening, which is nothing in a CI runner and is
          # worth not depending on.
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read it with the independent master
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: .venv-master/bin/python -u interop/probe.py --port 20000

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  rust-master:
    name: a Rust master reads the points and their quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A second implementation in a second language, rather than a second
    # interface onto the first. It also checks what the C++ job structurally
    # cannot: opendnp3's Python bindings store point values as bare scalars and
    # discard the quality octet, so that job verifies values and not flags.
    # This stack hands the flags to its read handler.
    #
    # The crate is Step Function I/O's `dnp3`, used under their public license,
    # which is not an open-source license:
    #   https://github.com/stepfunc/dnp3/blob/main/LICENSE.txt
    # They have said that this use, in this repository's public CI, is in line
    # with it (https://github.com/DERSecurity/py1815/issues/48).
    # A fork running this job should read the license for its own use;
    # commercial licensing is at https://stepfunc.io/contact.
    # interop/rust-master/README.md says more, and deleting that directory and
    # this job removes the crate entirely.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: pip install --quiet -e .

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the master's dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust-master/target
          key: rust-master-${{ hashFiles('interop/rust-master/Cargo.lock') }}

      - name: Check the independent master the way the rest of this repository is checked
        working-directory: interop/rust-master
        # ruff and mypy gate every other language here; nothing was gating this
        # one.
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build the independent master
        working-directory: interop/rust-master
        run: cargo build --locked

      - name: Start the outstation
        run: |
          # -u for the same reason the other jobs use it: a cancelled job
          # loses whatever sits in Python's block buffer, which is exactly
          # the output needed to explain the cancellation.
          python -u interop/outstation.py --port 20000 > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read it with the independent master
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: interop/rust-master/target/debug/interop-rust-master 127.0.0.1:20000

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  parsers:
    name: independent dissectors read the sweep and the master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The sweep walks the function code space and writes the exchange to a
    # capture. Then this library's master reads a second outstation and writes
    # its own capture, as `py1815-master serve --capture` does. Two dissectors
    # nobody here wrote read both back: in the sweep's the outstation's
    # responses are under test, in the master's the master's requests too.
    #
    # The captures are written by the code that made the traffic rather than
    # by tcpdump. That needs no root and has no race between starting a capture
    # and starting the traffic, whose failure mode is an empty file and a job
    # that passes because there was nothing to disagree with.
    # src/py1815/master/capture.py has the trade-off.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: pip install --quiet -e .

      - name: Install the dissectors
        run: |
          # tshark asks at install time whether non-superusers may capture.
          # This job only reads a file, and an unanswered question here would
          # hang the run rather than fail it.
          echo 'wireshark-common wireshark-common/install-setuid boolean false' \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark suricata
          tshark --version | head -1
          suricata -V

      - name: Start the outstation
        run: |
          # -u for the same reason the other jobs use it: a cancelled job
          # loses whatever sits in Python's block buffer, which is exactly
          # the output needed to explain the cancellation.
          #
          # --max-response 36 is what makes the conversation cases multi-fragment.
          # The ceiling is the outstation's own and no master can set it over the
          # wire, so a fixture given the default 2048 answers every one of these
          # reads in a single fragment and the walk proves nothing a single-reply
          # case does not. At 36 a class 1 read spans three fragments, so one of
          # them carries neither FIR nor FIN -- the state a two-fragment exchange
          # never produces -- and it goes into the capture the dissectors read.
          #
          # 34 is where the fixture's static block stops fitting a fragment,
          # which the outstation correctly refuses rather than splits -- the
          # sweep fails at 33 with PARAM_ERROR on every static read. So 36 is
          # two octets of margin above the floor rather than the floor itself,
          # and that margin is thin: one more static point in the fixture moves
          # the real boundary up past 36 and this ceiling has to rise with it.
          #
          # The masters in the other jobs keep the default; this is the sweep's
          # alone.
          python -u interop/outstation.py --port 20000 --max-response 36 > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Walk the function codes, recording the exchange
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: |
          python -u interop/sweep.py --port 20000 \
            --pcap sweep.pcap --summary sweep.json

      - name: Read the sweep's capture with Wireshark's dissector
        run: python -u interop/validate_pcap.py sweep.pcap --port 20000 --expect sweep.json

      - name: Read the sweep's capture with Suricata's parser
        run: |
          mkdir -p suricata-out
          suricata -r sweep.pcap -c interop/suricata.yaml -l suricata-out \
            --set app-layer.protocols.dnp3.detection-ports.dp=20000
          python -u interop/validate_suricata.py suricata-out/eve.json --expect sweep.json

      - name: Start a second outstation, for the master
        run: |
          # A fresh fixture rather than the sweep's: the sweep has read its
          # events and cleared its restart indication, and the master's startup
          # sequence, which clears that indication and confirms those events,
          # is part of what its capture should hold. The same --max-response
          # 36, so the master confirms a response of several fragments.
          python -u interop/outstation.py --port 20001 --max-response 36 \
            > outstation-master.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation-master.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation-master.log
          exit 1

      - name: Read it with this library's master, recording the exchange
        # Bounded well inside the job, so a hang fails here with a log.
        timeout-minutes: 3
        run: |
          python -u interop/master_capture.py --port 20001 \
            --pcap master.pcap --summary master.json

      - name: Read the master's capture with Wireshark's dissector
        run: |
          python -u interop/validate_pcap.py master.pcap --port 20001 --kind master \
            --expect master.json

      - name: Read the master's capture with Suricata's parser
        run: |
          mkdir -p suricata-master
          suricata -r master.pcap -c interop/suricata.yaml -l suricata-master \
            --set app-layer.protocols.dnp3.detection-ports.dp=20001
          python -u interop/validate_suricata.py suricata-master/eve.json --kind master \
            --expect master.json

      - name: Logs
        if: always()
        run: |
          cat outstation.log || true
          tail -50 suricata-out/suricata.log || true
          cat outstation-master.log || true
          tail -50 suricata-master/suricata.log || true

      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnp3-function-sweep
          path: |
            sweep.pcap
            sweep.json
            suricata-out/eve.json
            master.pcap
            master.json
            suricata-master/eve.json
          if-no-files-found: ignore

  opendnp3-outstation:
    name: the master reads and commands a C++ outstation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The other direction: this library's master against an outstation it did
    # not write. The outstation is built on opendnp3 through the dnp3-python
    # bindings, which need Python 3.10, so the job has two virtual environments.
    #
    # interop/master_check.py runs the checks. It compares what the master
    # decodes with the outstation's fixture, and what the outstation logs it
    # received with what the master sent.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for the master
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: |
          python -m venv .venv-master
          .venv-master/bin/pip install --quiet -e .

      - name: Set up Python for the outstation
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the independent outstation
        run: |
          python3.10 -m venv .venv-outstation
          .venv-outstation/bin/pip install --quiet dnp3-python==0.3.0b2

      - name: Start the independent outstation
        run: |
          .venv-outstation/bin/python -u interop/opendnp3_outstation.py --port 20000 \
            > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read and command it with this library's master
        # Bounded well inside the job, so a hang fails here with a log.
        timeout-minutes: 3
        run: |
          .venv-master/bin/python -u interop/master_check.py --port 20000 \
            --log outstation.log

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  rust-outstation:
    name: the master reads and commands a Rust outstation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same checks against a second independent outstation, built on Step
    # Function I/O's `dnp3` crate (https://github.com/stepfunc/dnp3).
    #
    # The crate is used under their public license, which is not an
    # open-source license:
    #   https://github.com/stepfunc/dnp3/blob/main/LICENSE.txt
    # They have said that using it for testing and interoperability of py1815
    # in this repository's public CI is in line with it
    # (https://github.com/DERSecurity/py1815/issues/48). A fork running this
    # job should read the license for its own use; commercial licensing is at
    # https://stepfunc.io/contact. interop/rust-outstation/README.md says
    # more, and deleting that directory and this job removes this use of it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: pip install --quiet -e .

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the outstation's dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust-outstation/target
          key: rust-outstation-${{ hashFiles('interop/rust-outstation/Cargo.lock') }}

      - name: Check the independent outstation's code
        working-directory: interop/rust-outstation
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build the independent outstation
        working-directory: interop/rust-outstation
        run: cargo build --locked

      - name: Start the independent outstation
        run: |
          interop/rust-outstation/target/debug/interop-rust-outstation 127.0.0.1:20000 \
            > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read and command it with this library's master
        # Bounded well inside the job, so a hang fails here with a log.
        timeout-minutes: 3
        run: python -u interop/master_check.py --port 20000 --log outstation.log

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  interop:
    name: interop
    runs-on: ubuntu-latest
    needs: [opendnp3-master, rust-master, parsers, opendnp3-outstation, rust-outstation]
    if: always()
    # One gate the branch protection can name, in front of however many peer
    # jobs there turn out to be.
    #
    # Required status checks are configured by job name, so naming each peer
    # directly means every time a peer is added, removed or renamed the branch
    # protection silently stops matching -- and a required check that no longer
    # runs is not a check that fails, it is a pull request that can never merge.
    # Adding a peer should not require an administrator.
    steps:
      - name: Every peer agreed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "peer jobs: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "a peer job did not succeed"
              exit 1
            fi
          done
          echo "every peer agreed with this library, as outstation and as master"
