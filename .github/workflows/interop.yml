name: interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Implementations that are not this one, reading this one.
#
# Everything in the unit suite is this library marking its own homework: a test
# that encodes with this library and decodes with it agrees with itself through
# any mistake both halves share. These jobs are the part that does not.
#
# Four implementations across three jobs, chosen so that no two of them are the
# same codebase wearing different clothes:
#
#   opendnp3-master  opendnp3 (https://github.com/dnp3/opendnp3), a C++ stack,
#                    driven through the dnp3-python bindings. Reads points
#                    and checks them.
#   rust-master      the `dnp3` crate by Step Function I/O
#                    (https://github.com/stepfunc/dnp3), a Rust stack by
#                    different authors. Reads points, checks the quality
#                    octet the C++ one discards, and confirms a refused
#                    control arrives as a refusal.
#   parsers          Wireshark and Suricata, two independent C dissectors,
#                    reading a capture of the whole function code sweep, and
#                    a capture of this library's master reading the same
#                    outstation, and verifying every checksum in both.
#
# The masters answer "does it say the right thing". The parsers answer "is what
# it put on the wire really DNP3". Those are different questions and neither
# subsumes the other.
#
# Two more jobs test the other direction: this library's master reading and
# commanding outstations it did not write.
#
#   opendnp3-outstation  an outstation built on opendnp3, the same C++ stack,
#                        through the dnp3-python bindings.
#   rust-outstation      an outstation built on the `dnp3` crate by Step
#                        Function I/O (https://github.com/stepfunc/dnp3).
#
# Both serve the same fixture and log every control and time write they
# receive. interop/master_check.py checks what the master decodes against the
# fixture, and what each outstation logged against what the master sent.
#
# Two things are checked against the Rust outstation only. It carries out
# counter freezes and logs them, and it listens with TLS. opendnp3 answers a
# freeze as a function it does not support, which is checked as a refusal, and
# its Python bindings cannot open a TLS server.
#
# One job is not a peer, and the gate at the end of this file waits for it
# too:
#
#   dnp3c-conformance    dnp3c (https://github.com/stepfunc/dnp3c), the
#                        conformance test harness from Step Function I/O, runs
#                        the outstation certification procedures of revision
#                        3.1 rev 1 at Subset Level 2 against this outstation.
#                        It fails when a procedure ends other than as recorded.
#                        docs/conformance.md says how each procedure ends.

jobs:
  opendnp3-master:
    name: a C++ master reads the points
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The master runs under its own Python 3.10 virtual environment, because
    # dnp3-python ships wheels for cp38 through cp310 only. Two environments in
    # one job rather than a container: fewer moving parts, nothing to cache.
    #
    # Its upstream is end-of-life, which disqualifies it as a dependency and
    # not as a witness: a frame it parses is a frame that was correct when it
    # was maintained, and the wire format has not moved.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for the outstation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: |
          python -m venv .venv-outstation
          .venv-outstation/bin/pip install --quiet -e .

      - name: Set up Python for the master
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the independent master
        run: |
          python3.10 -m venv .venv-master
          .venv-master/bin/pip install --quiet dnp3-python==0.3.0b2

      - name: Start the outstation
        run: |
          # -u because a cancelled job loses whatever sits in Python's block
          # buffer, which is exactly the output needed to explain the cancellation.
          .venv-outstation/bin/python -u interop/outstation.py --port 20000 \
            > outstation.log 2>&1 &
          # Waits for this outstation's own log line rather than for something
          # to be bound to the port. The port test would pass on whatever else
          # happened to be listening, which is nothing in a CI runner and is
          # worth not depending on.
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read it with the independent master
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: .venv-master/bin/python -u interop/probe.py --port 20000

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  rust-master:
    name: a Rust master reads the points and their quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A second implementation in a second language, rather than a second
    # interface onto the first. It also checks what the C++ job structurally
    # cannot: opendnp3's Python bindings store point values as bare scalars and
    # discard the quality octet, so that job verifies values and not flags.
    # This stack hands the flags to its read handler.
    #
    # The crate is Step Function I/O's `dnp3`, used under their public license,
    # which is not an open-source license:
    #   https://github.com/stepfunc/dnp3/blob/main/LICENSE.txt
    # They have said that this use, in this repository's public CI, is in line
    # with it (https://github.com/DERSecurity/py1815/issues/48).
    # A fork running this job should read the license for its own use;
    # commercial licensing is at https://stepfunc.io/contact.
    # interop/rust-master/README.md says more, and deleting that directory and
    # this job removes the crate entirely.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: pip install --quiet -e .

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the master's dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust-master/target
          key: rust-master-${{ hashFiles('interop/rust-master/Cargo.lock') }}

      - name: Check the independent master the way the rest of this repository is checked
        working-directory: interop/rust-master
        # ruff and mypy gate every other language here; nothing was gating this
        # one.
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build the independent master
        working-directory: interop/rust-master
        run: cargo build --locked

      - name: Start the outstation
        run: |
          # -u for the same reason the other jobs use it: a cancelled job
          # loses whatever sits in Python's block buffer, which is exactly
          # the output needed to explain the cancellation.
          python -u interop/outstation.py --port 20000 > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read it with the independent master
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: interop/rust-master/target/debug/interop-rust-master 127.0.0.1:20000

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  parsers:
    name: independent dissectors read the sweep and the master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The sweep walks the function code space and writes the exchange to a
    # capture. Then this library's master reads a second outstation and writes
    # its own capture, as `py1815-master serve --capture` does. Two dissectors
    # nobody here wrote read both back: in the sweep's the outstation's
    # responses are under test, in the master's the master's requests too.
    #
    # The captures are written by the code that made the traffic rather than
    # by tcpdump. That needs no root and has no race between starting a capture
    # and starting the traffic, whose failure mode is an empty file and a job
    # that passes because there was nothing to disagree with.
    # src/py1815/master/capture.py has the trade-off.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: pip install --quiet -e .

      - name: Install the dissectors
        run: |
          # tshark asks at install time whether non-superusers may capture.
          # This job only reads a file, and an unanswered question here would
          # hang the run rather than fail it.
          echo 'wireshark-common wireshark-common/install-setuid boolean false' \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark suricata
          tshark --version | head -1
          suricata -V

      - name: Start the outstation
        run: |
          # -u for the same reason the other jobs use it: a cancelled job
          # loses whatever sits in Python's block buffer, which is exactly
          # the output needed to explain the cancellation.
          #
          # --max-response 36 is what makes the conversation cases multi-fragment.
          # The ceiling is the outstation's own and no master can set it over the
          # wire, so a fixture given the default 2048 answers every one of these
          # reads in a single fragment and the walk proves nothing a single-reply
          # case does not. At 36 a class 1 read spans three fragments, so one of
          # them carries neither FIR nor FIN -- the state a two-fragment exchange
          # never produces -- and it goes into the capture the dissectors read.
          #
          # 34 is where the fixture's static block stops fitting a fragment,
          # which the outstation correctly refuses rather than splits -- the
          # sweep fails at 33 with PARAM_ERROR on every static read. So 36 is
          # two octets of margin above the floor rather than the floor itself,
          # and that margin is thin: one more static point in the fixture moves
          # the real boundary up past 36 and this ceiling has to rise with it.
          #
          # The masters in the other jobs keep the default; this is the sweep's
          # alone.
          python -u interop/outstation.py --port 20000 --max-response 36 > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Walk the function codes, recording the exchange
        # Bounded well inside the job, so a hang fails here with a log rather
        # than consuming the budget and taking the diagnostics down with it.
        timeout-minutes: 3
        run: |
          python -u interop/sweep.py --port 20000 \
            --pcap sweep.pcap --summary sweep.json

      - name: Read the sweep's capture with Wireshark's dissector
        run: python -u interop/validate_pcap.py sweep.pcap --port 20000 --expect sweep.json

      - name: Read the sweep's capture with Suricata's parser
        run: |
          mkdir -p suricata-out
          suricata -r sweep.pcap -c interop/suricata.yaml -l suricata-out \
            --set app-layer.protocols.dnp3.detection-ports.dp=20000
          python -u interop/validate_suricata.py suricata-out/eve.json --expect sweep.json

      - name: Start a second outstation, for the master
        run: |
          # A fresh fixture rather than the sweep's: the sweep has read its
          # events and cleared its restart indication, and the master's startup
          # sequence, which clears that indication and confirms those events,
          # is part of what its capture should hold. The same --max-response
          # 36, so the master confirms a response of several fragments.
          python -u interop/outstation.py --port 20001 --max-response 36 \
            > outstation-master.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation-master.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation-master.log
          exit 1

      - name: Read it with this library's master, recording the exchange
        # Bounded well inside the job, so a hang fails here with a log.
        timeout-minutes: 3
        run: |
          python -u interop/master_capture.py --port 20001 \
            --pcap master.pcap --summary master.json

      - name: Read the master's capture with Wireshark's dissector
        run: |
          python -u interop/validate_pcap.py master.pcap --port 20001 --kind master \
            --expect master.json

      - name: Read the master's capture with Suricata's parser
        run: |
          mkdir -p suricata-master
          suricata -r master.pcap -c interop/suricata.yaml -l suricata-master \
            --set app-layer.protocols.dnp3.detection-ports.dp=20001
          python -u interop/validate_suricata.py suricata-master/eve.json --kind master \
            --expect master.json

      - name: Logs
        if: always()
        run: |
          cat outstation.log || true
          tail -50 suricata-out/suricata.log || true
          cat outstation-master.log || true
          tail -50 suricata-master/suricata.log || true

      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnp3-function-sweep
          path: |
            sweep.pcap
            sweep.json
            suricata-out/eve.json
            master.pcap
            master.json
            suricata-master/eve.json
          if-no-files-found: ignore

  opendnp3-outstation:
    name: the master reads and commands a C++ outstation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The other direction: this library's master against an outstation it did
    # not write. The outstation is built on opendnp3 through the dnp3-python
    # bindings, which need Python 3.10, so the job has two virtual environments.
    #
    # interop/master_check.py runs the checks. It compares what the master
    # decodes with the outstation's fixture, and what the outstation logs it
    # received with what the master sent.
    #
    # --no-freeze because opendnp3 answers a counter freeze as a function it
    # does not support. The checks are then that the master reports each
    # refusal, that the frozen counters read back unchanged, and that the
    # stack's own log names each freeze sent with no response.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for the master
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: |
          python -m venv .venv-master
          .venv-master/bin/pip install --quiet -e .

      - name: Set up Python for the outstation
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the independent outstation
        run: |
          python3.10 -m venv .venv-outstation
          .venv-outstation/bin/pip install --quiet dnp3-python==0.3.0b2

      - name: Start the independent outstation
        run: |
          .venv-outstation/bin/python -u interop/opendnp3_outstation.py --port 20000 \
            > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read and command it with this library's master
        # Bounded well inside the job, so a hang fails here with a log.
        timeout-minutes: 3
        run: |
          .venv-master/bin/python -u interop/master_check.py --port 20000 \
            --log outstation.log --no-freeze

      - name: Outstation log
        if: always()
        run: cat outstation.log || true

  rust-outstation:
    name: the master reads and commands a Rust outstation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same checks against a second independent outstation, built on Step
    # Function I/O's `dnp3` crate (https://github.com/stepfunc/dnp3).
    #
    # The crate is used under their public license, which is not an
    # open-source license:
    #   https://github.com/stepfunc/dnp3/blob/main/LICENSE.txt
    # They have said that using it for testing and interoperability of py1815
    # in this repository's public CI is in line with it
    # (https://github.com/DERSecurity/py1815/issues/48). A fork running this
    # job should read the license for its own use; commercial licensing is at
    # https://stepfunc.io/contact. interop/rust-outstation/README.md says
    # more, and deleting that directory and this job removes this use of it.
    #
    # The checks run twice, against two outstation processes: once over plain
    # TCP and once over TLS. The second process is needed because the checks
    # change the outstation's points. The certificates are made in the job and
    # are never in the repository.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the library
        run: pip install --quiet -e .

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the outstation's dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust-outstation/target
          key: rust-outstation-${{ hashFiles('interop/rust-outstation/Cargo.lock') }}

      - name: Check the independent outstation's code
        working-directory: interop/rust-outstation
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build the independent outstation
        working-directory: interop/rust-outstation
        run: cargo build --locked

      - name: Start the independent outstation
        run: |
          interop/rust-outstation/target/debug/interop-rust-outstation 127.0.0.1:20000 \
            > outstation.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on' outstation.log 2>/dev/null; then
              echo "outstation listening"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation.log
          exit 1

      - name: Read and command it with this library's master
        # Bounded well inside the job, so a hang fails here with a log.
        timeout-minutes: 3
        run: python -u interop/master_check.py --port 20000 --log outstation.log

      - name: Make the certificates for TLS
        run: |
          openssl version
          interop/make_certificates.sh "$RUNNER_TEMP/certs"

      - name: Start the independent outstation with TLS
        run: |
          # master.test is the name the outstation accepts in the master's
          # certificate. The certificate script gives the master that name.
          interop/rust-outstation/target/debug/interop-rust-outstation 127.0.0.1:20001 \
            "$RUNNER_TEMP/certs/authority.pem" "$RUNNER_TEMP/certs/outstation.pem" \
            "$RUNNER_TEMP/certs/outstation.key" master.test \
            > outstation-tls.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q 'outstation listening on .* with TLS' outstation-tls.log 2>/dev/null; then
              echo "outstation listening with TLS"
              exit 0
            fi
            sleep 1
          done
          echo "outstation did not bind within 30s"
          cat outstation-tls.log
          exit 1

      - name: Read and command it over TLS with this library's master
        # Bounded well inside the job, so a hang fails here with a log.
        timeout-minutes: 3
        run: |
          # The outstation's certificate names outstation.test and not the
          # address connected to, so the master is told the name to check.
          python -u interop/master_check.py --port 20001 --log outstation-tls.log \
            --tls-ca "$RUNNER_TEMP/certs/authority.pem" \
            --tls-certificate "$RUNNER_TEMP/certs/master.pem" \
            --tls-key "$RUNNER_TEMP/certs/master.key" \
            --tls-server-name outstation.test

      - name: Outstation logs
        if: always()
        run: |
          cat outstation.log || true
          cat outstation-tls.log || true

  dnp3c-conformance:
    name: a conformance harness runs the certification procedures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # dnp3c (https://github.com/stepfunc/dnp3c) is Step Function I/O's
    # conformance test harness. It acts as a master and runs the outstation
    # test procedures of the DNP3 IED Certification Procedure, revision 3.1
    # rev 1, at Subset Level 2. The unit suite carries
    # the same procedures out from this project's own reading of them; this is
    # a reading by people who did not write this library.
    #
    # The steps a master cannot perform over DNP3 (cycle power, change an
    # input, check that an output operated) are done by the plugin in
    # interop/dnp3c, through a control channel that
    # interop/conformance_outstation.py serves beside the outstation. The
    # plugin starts that device for each procedure, and no step waits for a
    # person: the plugin implements the harness's plugin interface directly, so
    # there is no default that prompts.
    #
    # dnp3c is licensed under the GNU General Public License v3.0 only:
    #   https://github.com/stepfunc/dnp3c/blob/main/LICENSE
    # The plugin is a separate program that links the tool's library, which
    # Maven fetches when this job runs. Nothing of the tool or the plugin is in
    # the library, its wheel or its source distribution.
    # interop/dnp3c/README.md says more, and deleting that directory,
    # interop/conformance_outstation.py and this job removes dnp3c entirely.
    #
    # The `interop` job below needs this one, so a pull request cannot merge
    # while it fails. It takes about fifteen minutes, most of it timeouts the
    # procedures call for, and fetches the tool from Maven Central. What it
    # guards is the record in interop/dnp3c/expected.json, which has every
    # procedure that runs passing: the run step fails when a procedure fails,
    # and the comparison step fails when a procedure ends in any way other
    # than the one on record.
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the change can be compared with its base.
          fetch-depth: 0

      - name: Find out whether the change reaches the outstation
        id: scope
        # The full run takes about fifteen minutes, so it runs only for a
        # change that can alter what it tests: the library outside the master
        # (the outstation, its session, link, transport and objects, and the
        # IEEE 1815.2 profile), the device script, the harness and its record,
        # this workflow, or the project's dependencies. Any other change skips
        # the run and passes this job, so the gate below does not wait on it.
        # A manual run, and anything whose changes cannot be listed, runs it.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          case "$EVENT" in
            pull_request) range="$BASE...HEAD" ;;
            push) range="$BEFORE..HEAD" ;;
            *) range="" ;;
          esac
          if [ -n "$range" ] && changed=$(git diff --name-only "$range" 2>/dev/null); then
            reaching=$(printf '%s\n' "$changed" \
              | grep -E '^(src/py1815/|interop/conformance_outstation\.py$|interop/dnp3c/|\.github/workflows/interop\.yml$|pyproject\.toml$)' \
              | grep -v '^src/py1815/master/' || true)
            if [ -z "$reaching" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "the change reaches the outstation, or its scope cannot be told: every procedure runs"
            if [ -n "${reaching:-}" ]; then printf '%s\n' "$reaching"; fi
          else
            echo "no change reaches the outstation: the conformance run is skipped"
            {
              echo "### dnp3c conformance run"
              echo
              echo "Not run: nothing this change touches reaches the outstation or the harness."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install the library
        if: steps.scope.outputs.run == 'true'
        run: |
          pip install --quiet -e .
          # The plugin starts the device with this interpreter. It is named
          # here and not looked up, so the device runs the library just installed.
          echo "PY1815_CONFORMANCE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: interop/dnp3c/pom.xml

      - name: Build the plugin
        if: steps.scope.outputs.run == 'true'
        working-directory: interop/dnp3c
        run: mvn --batch-mode --no-transfer-progress compile

      - name: Find out whether packets can be captured here
        if: steps.scope.outputs.run == 'true'
        id: capture
        working-directory: interop/dnp3c
        # dnp3c saves each procedure's traffic as a capture when it is given a
        # network adapter. It captures with libpcap, which needs root, and a
        # capture that cannot be opened fails every procedure. So one procedure
        # is run with capture on first. If that leaves a capture with packets
        # in it, the whole run captures; if not, the run goes ahead without,
        # and says so.
        #
        # A capture file with no packet is 24 octets, its header.
        run: |
          # A later line of a properties file replaces an earlier one, so each
          # of these is device.ini with one or two options changed.
          cp device.ini capture.ini
          echo "tcp.capture.adapter = /127.0.0.1" >> capture.ini
          cp capture.ini probe.ini
          echo "test.output.directory = ./capture-probe" >> probe.ini
          works=false
          if sudo --preserve-env=PY1815_CONFORMANCE_PYTHON,JAVA_HOME env "PATH=$PATH" \
              mvn --batch-mode --no-transfer-progress -q \
              "-Dmaven.repo.local=$HOME/.m2/repository" \
              scala:run -Dlauncher=conformance "-DaddArgs=-rev|3.1r1|-config|probe.ini|-run|6.3.2"; then
            size=$(sudo stat -c %s capture-probe/3.1r1/L2/6.3.2/dump.pcap 2>/dev/null || echo 0)
            if [ "$size" -gt 24 ]; then works=true; fi
          fi
          sudo rm -rf capture-probe
          # The probe was root's. The steps after it, and the cache, are not.
          sudo chown -R "$(id -u):$(id -g)" . "$HOME/.m2"
          echo "works=$works" >> "$GITHUB_OUTPUT"
          if [ "$works" = true ]; then
            echo "packets can be captured: the run keeps each procedure's traffic"
          else
            echo "::warning::packets cannot be captured on this runner: the run keeps no captures"
          fi

      - name: Run every procedure, capturing its traffic
        if: steps.scope.outputs.run == 'true' && steps.capture.outputs.works == 'true'
        working-directory: interop/dnp3c
        # Bounded well inside the job, so a hang fails here with the results
        # so far and not at the job's limit with none. A whole run is about
        # fifteen minutes, most of it timeouts the procedures call for.
        timeout-minutes: 40
        run: |
          status=0
          sudo --preserve-env=PY1815_CONFORMANCE_PYTHON,JAVA_HOME env "PATH=$PATH" \
            mvn --batch-mode --no-transfer-progress -q \
            "-Dmaven.repo.local=$HOME/.m2/repository" \
            scala:run -Dlauncher=conformance "-DaddArgs=-rev|3.1r1|-config|capture.ini" || status=$?
          # The run was root's. The steps after it, and the cache, are not.
          sudo chown -R "$(id -u):$(id -g)" . "$HOME/.m2"
          exit "$status"

      - name: Run every procedure
        if: steps.scope.outputs.run == 'true' && steps.capture.outputs.works != 'true'
        working-directory: interop/dnp3c
        timeout-minutes: 40
        run: mvn --batch-mode --no-transfer-progress -q scala:run -Dlauncher=conformance "-DaddArgs=-rev|3.1r1"

      - name: Every procedure that sent a frame captured packets
        if: always() && steps.scope.outputs.run == 'true' && steps.capture.outputs.works == 'true'
        working-directory: interop/dnp3c/results/3.1r1/L2
        # A capture that silently recorded nothing looks like a capture. Each
        # procedure whose log shows a frame sent ("--P->") has to have one with
        # packets in it.
        run: |
          sent=0
          empty=0
          for dir in */; do
            grep -qE -- '--P-(>|&gt;)' "$dir/log.html" 2>/dev/null || continue
            sent=$((sent + 1))
            if [ ! -f "$dir/dump.pcap" ] || [ "$(stat -c %s "$dir/dump.pcap")" -le 24 ]; then
              echo "no packets captured for ${dir%/}"
              empty=$((empty + 1))
            fi
          done
          echo "$sent procedures sent frames; $empty captured no packets"
          [ "$sent" -gt 0 ] && [ "$empty" -eq 0 ]

      - name: Compare the run with the record
        if: always() && steps.scope.outputs.run == 'true'
        # The step that guards the record. It reads the result file dnp3c
        # leaves for each procedure and fails when one ended in any way other
        # than interop/dnp3c/expected.json says: newly failing, newly passing,
        # skipped for another reason, passing with a new warning, missing, or new.
        run: |
          status=0
          python interop/dnp3c/check_outcomes.py > comparison.txt || status=$?
          cat comparison.txt
          {
            echo "### dnp3c conformance run"
            echo
            echo '```'
            cat comparison.txt
            echo '```'
            echo
            echo "docs/conformance.md says how each procedure ends, and why."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Device log
        if: always() && steps.scope.outputs.run == 'true'
        run: tail -n 200 interop/dnp3c/results/3.1r1/L2/outstation.log || true

      - name: Keep the report, the logs and the captures
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dnp3c-conformance-results
          path: interop/dnp3c/results
          if-no-files-found: warn

  interop:
    name: interop
    runs-on: ubuntu-latest
    needs:
      [opendnp3-master, rust-master, parsers, opendnp3-outstation, rust-outstation, dnp3c-conformance]
    if: always()
    # One gate the branch protection can name, in front of however many peer
    # jobs there turn out to be.
    #
    # Required status checks are configured by job name, so naming each peer
    # directly means every time a peer is added, removed or renamed the branch
    # protection silently stops matching -- and a required check that no longer
    # runs is not a check that fails, it is a pull request that can never merge.
    # Adding a peer should not require an administrator.
    #
    # dnp3c-conformance is not a peer, but a pull request that breaks the
    # conformance record does not merge either, so the gate waits for it.
    steps:
      - name: Every peer agreed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "peer jobs: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "a peer job did not succeed"
              exit 1
            fi
          done
          echo "every peer agreed with this library, as outstation and as master, and the conformance run, where the change reaches the outstation, is the one on record"
