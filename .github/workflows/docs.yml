name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          activate-environment: true
      # mkdocstrings imports the package to read its docstrings, so the docs
      # build doubles as a check that the public API is importable.
      - run: uv sync --locked --extra docs
      - name: Build (warnings are errors)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
        with:
          path: site

  deploy:
    # Pull requests build the docs but do not publish them.
    #
    # Publishing is also opt-in via the PUBLISH_DOCS repository variable. A
    # GitHub Pages site is world-readable even when its repository is not, and
    # this one renders source, so the gate existed to stop Pages publishing
    # the code ahead of the decision to make the repository public. That
    # decision has been made and the variable is set; the gate stays as the
    # switch for turning publishing off without deleting the workflow.
    #
    # The build above runs on every push and pull request either way, so the
    # documentation stays verified whether or not it is served.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
