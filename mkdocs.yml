site_name: py1815
site_description: A DNP3 (IEEE 1815) outstation in pure Python
repo_url: https://github.com/DERSecurity/py1815
edit_uri: edit/main/docs/

theme:
  name: material
  # The cream mark reads on the teal header in both palettes; the charcoal
  # one is for browser tabs, which are usually light.
  logo: assets/satori-mark-dark.png
  favicon: assets/satori-mark.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# The planning directory is working material -- section-by-section status, what
# a review changed, what is still open -- and mkdocs builds every page under
# `docs/` whether or not the nav names it. Without this it is published as
# reachable orphan pages on a site that is meant to be read by people using the
# library rather than writing it. `DESIGN.md` is in the nav and is published on
# purpose; that is the difference.
exclude_docs: |
  planning/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - How DNP3 works: dnp3.md
  - Serving an outstation: outstation.md
  - Serving a DER: der.md
  - Configuring the outstation: der-config.md
  - The master: master.md
  - The console: console.md
  - The master's API: master-api.md
  - Configuring the master: master-config.md
  - Design decisions: DESIGN.md
  - Testing: testing.md
  - Reference:
      - Session: reference/session.md
      - Listener: reference/server.md
      - Objects: reference/objects.md
      - Controls: reference/control.md
      - Events: reference/events.md
      - DER profile: reference/profile.md
      - Master: reference/master.md
      - Protocol layers: reference/protocol.md
