# What dnp3c is told about the py1815 Subset Level 2 outstation that
# ../conformance_outstation.py serves. Every option the tool has is stated, so
# none is left to a default that a later version of the tool could change.
#
# A supports.* option is off only where the outstation does not have the
# feature. README.md lists each one that is off, with the reason.

# ------------------------------------------------------------ the harness

test.output.directory = ./results
test.deviceUnderTest = py1815 Subset Level 2 outstation
# Not used: nothing in this run is done by a person.
test.manual.actionWindowMs = 10000
# How far a time the harness measures may be off: the tool's default.
test.timingToleranceMs = 500
# Nothing is excluded: every procedure that applies to the outstation runs.

# ---------------------------------------------------------------- TCP

# The plugin starts the device on this port, at a loopback address of its own:
# the network tests connect from network.master.address, some of them from
# port 20000.
tcp.device.address = 127.0.0.2
tcp.device.port = 20000
# Empty turns packet capture off. The CI job sets it.
tcp.capture.adapter =

# ------------------------------------------------------------- serial

# The outstation is reached over TCP only, so no serial test runs.
serial.enabled = false
serial.port =
serial.baudRate = 9600
serial.dataBits = 8
serial.parity = none
serial.stopBits = 1
serial.multiDrop = false
serial.otherDevices =
serial.rtsDelays =
serial.collisionAvoidance = false
serial.collisionDetection = data
serial.fixedDelayMs = 0
serial.maxRandomDelayMs = 0
serial.otherFixedDelayMs = 0
serial.otherMaxRandomDelayMs = 0
serial.timingToleranceMs = 20

# ---------------------------------------------------------- data link

link.source = 1
link.destination = 1024
# Not used: the outstation answers to one address.
link.otherDestination = 1025
link.num.retry = 3
link.timeout.ms = 1000

# ------------------------------------------------- application layer

# The outstation is built as a Subset Level 2 device.
outstation.subset.level = 2
# The session's defaults: a select stays armed for ten seconds, and a response
# that asked for confirmation waits ten seconds for it.
outstation.select.timeout.ms = 10000
outstation.app.confirm.timeout.ms = 10000
# How long the harness waits for a response.
outstation.response.timeout.ms = 2000
# The second fragment size the fragmentation procedure sets. It has to hold
# one static block of the outstation, which is up to 1024 octets.
outstation.fragmentSize = 1100

# ---------------------------------------------------- binary outputs

# Binary outputs 0 to 9. A request may carry as many controls as fit a
# fragment, so the limit is every point there is.
binaryOutput.installedPoints = 0 ... 9
binaryOutput.uninstalled.index = 65535
binaryOutput.maxPointsInSingleRequest = 10
# Outputs have no flags a test bench can change, and report no events.
binaryOutput.status.changeableFlags =
binaryOutput.status.stateChangeEvents = false

binaryOutput.primary.valid.index = 0
binaryOutput.primary.valid.function = 0x03
binaryOutput.primary.valid.count = 1
binaryOutput.primary.valid.onTime.ms = 100
binaryOutput.primary.valid.offTime.ms = 100

binaryOutput.alternate.valid.index = 1
binaryOutput.alternate.valid.function = 0x41
binaryOutput.alternate.valid.count = 1
binaryOutput.alternate.valid.onTime.ms = 100
binaryOutput.alternate.valid.offTime.ms = 100

# Every binary output accepts every control code below and behaves as a latch:
# close and the "on" operations set it, trip and the "off" operations clear it.
# So each point named here does support the codes the option is for. None of
# them supports only those.
binaryOutput.latchOnOffPoint.index = 2
binaryOutput.latchOnOffPoint.count = 1
binaryOutput.latchOnOffPoint.onTime.ms = 100
binaryOutput.latchOnOffPoint.offTime.ms = 100

binaryOutput.pulseOnOffPoint.index = 3
binaryOutput.pulseOnOffPoint.count = 1
binaryOutput.pulseOnOffPoint.onTime.ms = 100
binaryOutput.pulseOnOffPoint.offTime.ms = 100

binaryOutput.latchAndPulsePoint.index = 4
binaryOutput.latchAndPulsePoint.count = 1
binaryOutput.latchAndPulsePoint.onTime.ms = 100
binaryOutput.latchAndPulsePoint.offTime.ms = 100

binaryOutput.singleFunctionPulseOnPoint.index = 5
binaryOutput.singleFunctionPulseOnPoint.count = 1
binaryOutput.singleFunctionPulseOnPoint.onTime.ms = 100
binaryOutput.singleFunctionPulseOnPoint.offTime.ms = 100

binaryOutput.singleFunctionLatchOnPoint.index = 6
binaryOutput.singleFunctionLatchOnPoint.count = 1
binaryOutput.singleFunctionLatchOnPoint.onTime.ms = 100
binaryOutput.singleFunctionLatchOnPoint.offTime.ms = 100

binaryOutput.singleFunctionLatchOffPoint.index = 7
binaryOutput.singleFunctionLatchOffPoint.count = 1
binaryOutput.singleFunctionLatchOffPoint.onTime.ms = 100
binaryOutput.singleFunctionLatchOffPoint.offTime.ms = 100

binaryOutput.singleFunctionPulseOnClosePoint.index = 8
binaryOutput.singleFunctionPulseOnClosePoint.count = 1
binaryOutput.singleFunctionPulseOnClosePoint.onTime.ms = 100
binaryOutput.singleFunctionPulseOnClosePoint.offTime.ms = 100

binaryOutput.singleFunctionPulseOnTripPoint.index = 9
binaryOutput.singleFunctionPulseOnTripPoint.count = 1
binaryOutput.singleFunctionPulseOnTripPoint.onTime.ms = 100
binaryOutput.singleFunctionPulseOnTripPoint.offTime.ms = 100

# ---------------------------------------------------- analog outputs

analogOutput.installedPoints = 0 ... 9
analogOutput.uninstalled.index = 65535
analogOutput.maxPointsInSingleRequest = 10
# Every analog output accepts a 32-bit command (g41v1) as well as a 16-bit one,
# and reports its status in either width.
analogOutput.commands32Bit = true
analogOutput.index32Bit = 0
analogOutput.status.only32Bit =
# Outputs have no flags a test bench can change, and report no events.
analogOutput.status.changeableFlags =
analogOutput.status.valueChangeEvents = false
analogOutput.status.deadband = 1
analogOutput.status.commandResetsBase = false
analogOutput.primary.valid.index = 0
analogOutput.primary.valid.value = 10
analogOutput.alternate.valid.index = 1
analogOutput.alternate.valid.value = 11

# -------------------------------------------------------------- classes

# Binary inputs 0 to 7 report in class 1 and 8 to 11 in class 2. The analog
# inputs report in class 3.
class.supportClass1 = true
class.numClass1EventsGenerated = 3
class.supportClass2 = true
class.numClass2EventsGenerated = 3
class.supportClass3 = true
class.numClass3EventsGenerated = 3
# The binary inputs in each class when the outstation starts. Assign class is
# not implemented, so a point's class is fixed when the outstation is built.
class.assign.class1BinaryInputs = 0 ... 7
class.assign.class2BinaryInputs = 8 ... 11
class.assign.class3BinaryInputs =

binaryInput.numEventsGenerated = 3
binaryInput.eventsClass = 1
# A read of g2 variation 0, or of a class, reports binary input events with
# absolute time (g2v2).
binaryInput.defaultEventVariation = 2
analogInput.eventsClass = 3
# 3.1r1's 8.19.2.4 moves analog input 0 and back. The deadband is the one
# conformance_outstation.py sets, and a value is reported exactly as applied.
analogInput.valueReturn.index = 0
analogInput.valueReturn.deadband = 10
analogInput.valueTolerance = 0
# Analog inputs are reported in 16 or 32 bits, as asked.
analogInput.only16Bit =
analogInput.only32Bit =
# Counters are reported in 32 bits only: a counter in g20v1 and a frozen
# counter in g21v1, v5 or v9. Nothing counts by itself.
counter.alwaysCounting =
counter.only16Bit =
counter.only32Bit = 0 ... 3
counter.frozen.only16Bit =
counter.frozen.only32Bit = 0 ... 3
# Not used: the outstation has no counter events and no double-bit inputs.
counter.numEventsGenerated = 3
counter.eventsClass = 3
doubleBitInput.numEventsGenerated = 3
doubleBitInput.eventsClass = 1

# --------------------------------------------------------- event buffers

# Each class holds 2000 events before its oldest is lost, which is the
# outstation's default. Only the binary figure is used: analog inputs keep one
# event for each point, and the other two kinds of event do not exist here.
event.buffer.maxBinaryInputEvents = 2000
event.buffer.maxAnalogInputEvents = 2000
event.buffer.maxCounterEvents = 2000
event.buffer.maxDoubleBitInputEvents = 2000

# ----------------------------------------------------------------- time

# The outstation asks for the time in its first response after a restart. The
# device asks again ten seconds after a master writes it; the figure here
# allows a second more.
timesync.supportSynchronizingTimeFromMaster = true
# Record current time (function code 24) followed by a write of g50v3 is
# supported.
timesync.supportLanTimeSync = true
timesync.maxTimeFromResetToIIN14Ms = 0
timesync.maxTimeBetweenSyncRequestsMs = 11000
timesync.timeWriteLatencyMs = 5
timesync.binaryInputChangeWithTime = true
timesync.binaryInputChangeWithRelativeTime = true
timesync.doubleBitInputChangeWithTime = false
timesync.doubleBitInputChangeWithRelativeTime = false
# Binary input events are served with absolute and with relative time, so a
# read of either is never refused. There are no double-bit inputs.
timesync.binaryInputChangeWithTimeRejected = false
timesync.binaryInputChangeWithRelativeTimeRejected = false
timesync.doubleBitInputChangeWithTimeRejected = false
timesync.doubleBitInputChangeWithRelativeTimeRejected = false
# The device asks for the time again ten seconds after a master writes it,
# and stops trusting its clock twenty seconds after the write.
timesync.timeToUnsynchronizedMs = 20000

# -------------------------------------------------- unsolicited responses

# The outstation's default wait for the confirmation of an unsolicited response.
unsolicited.unsolicitedConfirmTimeoutMs = 5000
unsolicited.otherMasterAddress = 2
# An event of an enabled class is reported as soon as it is recorded.
unsolicited.hasMinNumEventsBeforeUnsolicited = false
unsolicited.holdOffMs = 0
# The number of retries is a setting a power cycle applies.
unsolicited.retryLimitConfigurable = true
unsolicited.retryLimit = 5

# ------------------------------------------------------ other behavior

# Not used: the outstation never sends a frame that asks for a link confirmation.
behaviors.resetsLinkOnNack = false
# Not used: outputs have no local state.
flag.tests.individualRemoteSupervisoryOutputIndex = 0
flag.tests.individualRemoteSupervisoryRemoteOutputIndex = 1
# 3.1r1's 8.6.5 reads class 1 after its broadcast; no class holds frozen
# counter events.
flag.tests.broadcastReadClass = 1
# Not used: the outstation has no device attributes.
attributes.supportedVariations =
attributes.writableVariations =

# ------------------------------------------- what the outstation has

supports.binaryInput = true
supports.disable.binaryInput = true
supports.binaryInputChangeEvents = true
supports.binaryInputReads = true
supports.binaryInputEventReads = true

supports.counter = true
supports.disable.counter = true
supports.frozenCounter = true
supports.disable.frozenCounter = true
supports.counterReads = true
supports.frozenCounterReads = true

supports.analogInput = true
supports.disable.analogInput = true
supports.analogInputChangeEvents = true
supports.analogInputReads = true
supports.analogInputEventReads = true

supports.binaryOutput.status = true
supports.binaryOutput.commands = true
supports.disable.binaryOutput = true

supports.analogOutput.status = true
supports.analogOutput.commands = true
supports.disable.analogOutput = true

supports.multiFragmentResponses = true
supports.configurableFragmentSize = true
supports.unsolicitedResponse = true
# Static reads take a start-stop range (qualifiers 0x00 and 0x01).
supports.rangeReads = true

# ---------------------------------- what it does not have (see README.md)

supports.doubleBitInput = false
supports.disable.doubleBitInput = false
supports.doubleBitInputChangeEvents = false
supports.counterChangeEvents = false
supports.counterEventsQueuedPerPoint = false
supports.frozenCounterChangeEvents = false
supports.analogInputEventsQueuedPerPoint = false
supports.binaryOutputChangeEvents = false
supports.analogOutputChangeEvents = false
supports.dataLinkConfirmRequests = false
supports.dataLinkRetries = false
supports.selfAddress = false
supports.assignNoClass = false
supports.globalRemoteSupervisoryControl = false
supports.individualRemoteSupervisoryControl = false
supports.deviceAttributes = false
supports.counterEventReads = true
supports.frozenCounterEventReads = true
supports.doubleBitInputReads = true
supports.doubleBitInputEventReads = true
supports.binaryOutputCommandEvents = false
supports.analogOutputCommandEvents = false
supports.multipleAddresses = false

# ----------------------------------------------- network (3.1r1 section 9)

# The device takes TCP connections from any master, on port 20000 or another
# port it is set to, and broadcasts sent to that port as UDP datagrams. It has
# no list of masters it accepts, answers no UDP request and joins no multicast
# group.
network.tcp = true
network.master.address = 127.0.0.1
network.tcp.anyAddress = true
network.tcp.configurablePort = true
network.tcp.otherPort = 20001
network.tcp.specificAddress = false
network.otherMasterAddress = 192.0.2.1
network.tcp.wildcard = false
network.tcp.udpBroadcast = true
network.tcp.multicast = false
network.multicastGroup =
network.udp = false
network.udp.alone = true
network.udp.anyAddress = true
network.udp.respondToOriginatingPort = false
network.udp.respondTo20000 = false
network.udp.configurablePort = false
network.udp.otherPort = 20001
network.udp.specificAddress = false
network.udp.wildcard = false
network.udp.unsolicited = false
network.udp.unsolicitedTo20000 = false
network.udp.unsolicitedNullOtherPort = false
network.udp.unsolicitedPort = 20002
network.udp.unsolicitedToOriginatingPort = false
network.udp.fixedOtherPort = false
network.udpAndTcp = false
network.wildcardRange =
network.master.wildcardAddress =
network.master.outsideAddress =
