# What dnp3c is told about the py1815 Subset Level 2 outstation that
# ../conformance_outstation.py serves. Every option the tool has is stated, so
# none is left to a default that a later version of the tool could change.
#
# A supports.* option is off only where the outstation does not have the
# feature. README.md lists each one that is off, with the reason.

# ------------------------------------------------------------ the harness

test.output.directory = ./results
test.deviceUnderTest = py1815 Subset Level 2 outstation
# Not used: nothing in this run is done by a person.
test.manual.actionWindowMs = 10000

# ---------------------------------------------------------------- TCP

# The plugin starts the device on this port, on the loopback interface.
tcp.device.address = 127.0.0.1
tcp.device.port = 20000
# Empty turns packet capture off. The CI job sets it.
tcp.capture.adapter =

# ---------------------------------------------------------- data link

link.source = 1
link.destination = 1024
link.num.retry = 3
link.timeout.ms = 1000

# ------------------------------------------------- application layer

# The session's defaults: a select stays armed for ten seconds, and a response
# that asked for confirmation waits ten seconds for it.
outstation.select.timeout.ms = 10000
outstation.app.confirm.timeout.ms = 10000
# How long the harness waits for a response.
outstation.response.timeout.ms = 2000
# The second fragment size the fragmentation procedure sets. It has to hold
# one static block of the outstation, which is up to 1024 octets.
outstation.fragmentSize = 1100

# ---------------------------------------------------- binary outputs

# Binary outputs 0 to 9. A request may carry as many controls as fit a
# fragment, so the limit is every point there is.
control.installedPoints = 0 ... 9
control.uninstalled.index = 65535
control.maxControlPointsInSingleRequest = 10

control.primary.valid.index = 0
control.primary.valid.function = 0x03
control.primary.valid.count = 1
control.primary.valid.onTime.ms = 100
control.primary.valid.offTime.ms = 100

control.alternate.valid.index = 1
control.alternate.valid.function = 0x41
control.alternate.valid.count = 1
control.alternate.valid.onTime.ms = 100
control.alternate.valid.offTime.ms = 100

# Every binary output accepts every control code below and behaves as a latch:
# close and the "on" operations set it, trip and the "off" operations clear it.
# So each point named here does support the codes the option is for. None of
# them supports only those.
control.latchOnOffPoint.index = 2
control.latchOnOffPoint.count = 1
control.latchOnOffPoint.onTime.ms = 100
control.latchOnOffPoint.offTime.ms = 100

control.pulseOnOffPoint.index = 3
control.pulseOnOffPoint.count = 1
control.pulseOnOffPoint.onTime.ms = 100
control.pulseOnOffPoint.offTime.ms = 100

control.latchAndPulsePoint.index = 4
control.latchAndPulsePoint.count = 1
control.latchAndPulsePoint.onTime.ms = 100
control.latchAndPulsePoint.offTime.ms = 100

control.singleFunctionPulseOnPoint.index = 5
control.singleFunctionPulseOnPoint.count = 1
control.singleFunctionPulseOnPoint.onTime.ms = 100
control.singleFunctionPulseOnPoint.offTime.ms = 100

control.singleFunctionLatchOnPoint.index = 6
control.singleFunctionLatchOnPoint.count = 1
control.singleFunctionLatchOnPoint.onTime.ms = 100
control.singleFunctionLatchOnPoint.offTime.ms = 100

control.singleFunctionLatchOffPoint.index = 7
control.singleFunctionLatchOffPoint.count = 1
control.singleFunctionLatchOffPoint.onTime.ms = 100
control.singleFunctionLatchOffPoint.offTime.ms = 100

control.singleFunctionPulseOnClosePoint.index = 8
control.singleFunctionPulseOnClosePoint.count = 1
control.singleFunctionPulseOnClosePoint.onTime.ms = 100
control.singleFunctionPulseOnClosePoint.offTime.ms = 100

control.singleFunctionPulseOnTripPoint.index = 9
control.singleFunctionPulseOnTripPoint.count = 1
control.singleFunctionPulseOnTripPoint.onTime.ms = 100
control.singleFunctionPulseOnTripPoint.offTime.ms = 100

# ---------------------------------------------------- analog outputs

analogOutput.installedPoints = 0 ... 9
analogOutput.uninstalled.index = 65535
analogOutput.maxAnalogOutputsInSingleRequest = 10
analogOutput.primary.valid.index = 0
analogOutput.primary.valid.value = 10
analogOutput.alternate.valid.index = 1
analogOutput.alternate.valid.value = 11

# -------------------------------------------------------------- classes

# Binary inputs 0 to 7 report in class 1 and 8 to 11 in class 2. The analog
# inputs report in class 3.
class.supportClass1 = true
class.numClass1EventsGenerated = 3
class.supportClass2 = true
class.numClass2EventsGenerated = 3
class.supportClass3 = true
class.numClass3EventsGenerated = 3

binaryInput.numBinaryEventsGenerated = 3
binaryInput.binaryEventsClass = 1
analogInput.analogInputEventsClass = 3
# Not used: the outstation has no counter events and no double-bit inputs.
counter.numCounterEventsGenerated = 3
counter.counterEventsClass = 3
doubleBitInput.numDoubleBitEventsGenerated = 3
doubleBitInput.doubleBitEventsClass = 1

# --------------------------------------------------------- event buffers

# Each class holds 2000 events before its oldest is lost, which is the
# outstation's default. Only the binary figure is used: analog inputs keep one
# event for each point, and the other two kinds of event do not exist here.
event.buffer.maxBinaryInputEvents = 2000
event.buffer.maxAnalogInputEvents = 2000
event.buffer.maxCounterEvents = 2000
event.buffer.maxDoubleBitBinaryInputEvents = 2000

# ----------------------------------------------------------------- time

# The outstation asks for the time in its first response after a restart. The
# device asks again ten seconds after a master writes it; the figure here
# allows a second more.
timesync.supportSynchronizingTimeFromMaster = true
timesync.maxTimeFromResetToIIN14Ms = 0
timesync.maxTimeBetweenSyncRequestsMs = 11000
timesync.timeWriteLatencyMs = 5
timesync.binaryInputChangeWithTime = true
timesync.binaryInputChangeWithRelativeTime = true
timesync.doubleBitInputChangeWithTime = false
timesync.doubleBitInputChangeWithRelativeTime = false

# -------------------------------------------------- unsolicited responses

# The outstation's default wait for the confirmation of an unsolicited response.
unsolicited.unsolicitedConfirmTimeoutMs = 5000
unsolicited.otherMasterAddress = 2
# An event of an enabled class is reported as soon as it is recorded.
unsolicited.hasMinNumEventsBeforeUnsolicited = false
unsolicited.holdOffMs = 0

# ------------------------------------------------------ other behavior

# Not used: the outstation never sends a frame that asks for a link confirmation.
behaviors.resetsLinkOnNack = false
# Not used: outputs have no local state.
flag.tests.individualRemoteSupervisoryOutputIndex = 0
# Not used: the outstation has no device attributes.
attributes.supportedVariations =
attributes.writableVariations =

# ------------------------------------------- what the outstation has

supports.binaryInput = true
supports.disable.binaryInput = true
supports.binaryInputChangeEvents = true

supports.counter = true
supports.disable.counter = true
supports.frozenCounter = true
supports.disable.frozenCounter = true

supports.analog = true
supports.disable.analog = true
supports.analogChangeEvents = true

supports.binaryOutput.status = true
supports.binaryOutput.commands = true
supports.disable.binaryOutput = true

supports.analogOutput.status = true
supports.analogOutput.commands = true
supports.disable.analogOutput = true

supports.multiFragmentResponses = true
supports.configurableFragmentSize = true
supports.unsolicitedResponse = true

# ---------------------------------- what it does not have (see README.md)

supports.doubleBit = false
supports.disable.doubleBit = false
supports.doubleBitChangeEvents = false
supports.counterChangeEvents = false
supports.counterEventsQueuedPerPoint = false
supports.frozenCounterChangeEvents = false
supports.analogEventsQueuedPerPoint = false
supports.binaryOutputChangeEvents = false
supports.analogOutputChangeEvents = false
supports.dataLinkConfirmRequests = false
supports.dataLinkRetries = false
supports.selfAddress = false
supports.noClassAssignment = false
supports.globalRemoteSupervisoryControl = false
supports.individualRemoteSupervisoryControl = false
supports.deviceAttributes = false
